[package]
name = "teach-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[lib]
name = "teach_core"
path = "src/lib.rs"

[[bin]]
name = "teach"
path = "src/bin/teach.rs"

[dependencies]
uiautomation = { version = "0.25", features = ["event", "pattern"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
] }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "3", features = ["platform-verifier"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
croner = "=5.0.1"
chrono = "0.4"


[dev-dependencies]
# chỉ spike_secret (M0 0.9) dùng để đo; lõi gọi CredWriteW trực tiếp (secrets.rs)
keyring = "4"
